# Publishes the static version of the site (no server) to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Content comes from static/site-data.json (regenerate with `npm run export:data`, see DEPLOY-GITHUB-PAGES.md).

name: Deploy static site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "public/**"
      - "scripts/build-static.js"
      - "scripts/lib/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build static site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ -f static/CNAME ]; then
            # Custom domain: served from the root
            BASE=""
            SITE_URL="https://$(tr -d '[:space:]' < static/CNAME)"
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            # User/organisation page: served from the root
            BASE=""
            SITE_URL="https://$REPO_NAME"
          else
            # Project page: https://<owner>.github.io/<repo>/
            BASE="/$REPO_NAME"
            SITE_URL="https://$OWNER_LC.github.io/$REPO_NAME"
          fi
          node scripts/build-static.js --base "$BASE" --site-url "$SITE_URL"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

      - id: deployment
        uses: actions/deploy-pages@v4
