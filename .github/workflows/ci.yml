# CI and deploy. Required repo secrets for deploy: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY.
# Optional: SSH_PORT (defaults to 22). Server clone should live at ~/company-site (see DEPLOY.md).
# Deploy runs Docker Compose with the production overlay (Caddy + HTTPS) on the server.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (all server and browser scripts)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Dependency audit (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      HAS_SSH_SECRETS: ${{ secrets.SSH_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Skip deploy (SSH secrets not configured)
        if: env.HAS_SSH_SECRETS != 'true'
        run: echo "Deploy skipped - add SSH_HOST, SSH_USER and SSH_PRIVATE_KEY repository secrets to enable it."

      - name: Deploy over SSH
        if: env.HAS_SSH_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT == '' && '22' || secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/company-site
            git pull --ff-only
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker image prune -f
